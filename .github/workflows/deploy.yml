name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to QNAP NAS
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to NAS
        run: |
          set -e
          DEPLOY_DIR="/share/CACHEDEV1_DATA/Public/ElevatorSystem"

          # Pipe code via tar — volume mounts from a containerized runner refer to
          # the Docker host, not the runner's filesystem, so -v ${{ github.workspace }}
          # would mount an empty/nonexistent host path.
          tar cz \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='uploads' \
            -C "$GITHUB_WORKSPACE" . | \
          docker run --rm -i \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /share/CACHEDEV1_DATA:/share/CACHEDEV1_DATA \
            alpine:3.19 sh -c "
              set -e
              apk add --no-cache rsync docker-cli docker-compose tar

              mkdir -p /tmp/code
              tar xzf - -C /tmp/code

              mkdir -p '$DEPLOY_DIR'
              rsync -a --delete /tmp/code/ '$DEPLOY_DIR/'

              cd '$DEPLOY_DIR'
              mkdir -p uploads/photos uploads/videos uploads/contracts uploads/exports

              echo '=== Building and restarting services ==='
              docker compose -f docker-compose.prod.yml up -d --build --remove-orphans --force-recreate

              echo '=== Cleaning old images ==='
              docker image prune -f

              echo '=== Deployment complete ==='
              docker compose -f docker-compose.prod.yml ps
            "

      - name: Verify deployment
        run: |
          sleep 15
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            alpine:3.19 sh -c "
              apk add --no-cache docker-cli docker-compose curl
              echo '=== Service status ==='
              docker ps --filter 'name=elevator-' --format 'table {{.Names}}\t{{.Status}}'

              echo ''
              echo '=== Waiting for API to be healthy ==='
              for i in \$(seq 1 30); do
                health=\$(docker inspect --format='{{.State.Health.Status}}' elevator-api 2>/dev/null)
                [ \"\$health\" = 'healthy' ] && echo 'API healthy after \${i}s' && break
                [ \$i -eq 30 ] && echo 'API not healthy after 30s, continuing anyway'
                sleep 2
              done

              echo ''
              echo '=== Checking database users ==='
              sleep 3
              docker exec elevator-postgres psql -U elevator -d elevator_system -c 'SELECT phone, role FROM \"User\";' 2>&1 || echo 'No users found - seed may not have run'
            "

      - name: Smoke test API
        run: |
          set -e
          fail() { echo "❌ $1"; exit 1; }

          echo '=== Database user count ==='
          docker exec elevator-postgres psql -U elevator -d elevator_system -c 'SELECT phone, role FROM "User";' 2>&1

          # Test API directly via container network
          echo '=== 1/4 Testing API health ==='
          docker run --rm --network container:elevator-api \
            alpine:3.19 sh -c "apk add --no-cache curl && curl -sf http://localhost:3000/api" \
            && echo 'API health: OK' || fail 'API health check failed'

          echo ''
          echo '=== 2/4 Testing login endpoint ==='
          LOGIN_RESULT=$(docker run --rm --network container:elevator-api \
            alpine:3.19 sh -c "
              apk add --no-cache curl
              curl -s -X POST http://localhost:3000/api/auth/login \
                -H 'Content-Type: application/json' \
                -d '{\"phone\":\"13800000000\",\"password\":\"admin123\"}'
            ")
          echo "$LOGIN_RESULT"
          echo "$LOGIN_RESULT" | grep -q '"accessToken"' && echo 'Login: ✅ Token received' || fail 'Login returned no token'

          echo ''
          echo '=== 3/4 Testing nginx proxy to admin ==='
          NGINX_ADMIN=$(docker run --rm --network container:elevator-nginx \
            alpine:3.19 sh -c "
              apk add --no-cache curl
              curl -s -o /dev/null -w '%{http_code}' http://localhost:80/
            ")
          echo "HTTP $NGINX_ADMIN"
          [ "$NGINX_ADMIN" = "200" ] && echo 'Nginx → admin: ✅' || fail "Nginx admin returned HTTP $NGINX_ADMIN"

          echo ''
          echo '=== 4/4 Testing nginx proxy to API ==='
          NGINX_LOGIN=$(docker run --rm --network container:elevator-nginx \
            alpine:3.19 sh -c "
              apk add --no-cache curl
              curl -s -X POST http://localhost:80/api/auth/login \
                -H 'Content-Type: application/json' \
                -d '{\"phone\":\"13800000000\",\"password\":\"admin123\"}'
            ")
          echo "$NGINX_LOGIN"
          echo "$NGINX_LOGIN" | grep -q '"accessToken"' && echo 'Nginx → API login: ✅ Token received' || fail 'Nginx API login returned no token'

          echo ''
          echo '=== All smoke tests passed ✅ ==='
