name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to QNAP NAS
    runs-on: self-hosted

    steps:
      - name: Network diagnostics
        run: |
          echo '=== Runner DNS config ==='
          cat /etc/resolv.conf 2>/dev/null || echo 'no resolv.conf'
          echo ''
          echo '=== DNS resolution test ==='
          nslookup github.com 2>&1 || true
          echo ''
          echo '=== IPv4 connectivity ==='
          timeout 10 curl -4 -v https://github.com 2>&1 | head -20 || true
          echo ''
          echo '=== MTU check ==='
          ip link 2>/dev/null | head -10 || true

      - name: Checkout with retry
        uses: actions/checkout@v4
        continue-on-error: true
        id: checkout_attempt1

      - name: Retry checkout if failed
        if: steps.checkout_attempt1.outcome == 'failure'
        run: |
          echo 'Checkout failed — waiting 10s then retrying with explicit DNS...'
          sleep 10
          git clone -b main --depth 1 https://github.com/wenlongyan2021/elevator-system.git .
        shell: bash

      - name: Ensure checkout succeeded
        if: steps.checkout_attempt1.outcome == 'failure'
        run: |
          echo 'Verifying checkout...'
          git log -1 --oneline 2>/dev/null || { echo 'Checkout failed after retry'; exit 1; }

      - name: Deploy to NAS
        run: |
          set -e
          DEPLOY_DIR="/share/CACHEDEV1_DATA/Public/ElevatorSystem"

          # Pipe code via tar — volume mounts from a containerized runner refer to
          # the Docker host, not the runner's filesystem, so -v ${{ github.workspace }}
          # would mount an empty/nonexistent host path.
          tar cz \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='uploads' \
            -C "$GITHUB_WORKSPACE" . | \
          docker run --rm -i \
            --dns 8.8.8.8 --dns 1.1.1.1 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /share/CACHEDEV1_DATA:/share/CACHEDEV1_DATA \
            alpine:3.19 sh -c "
              set -e
              apk add --no-cache rsync docker-cli docker-compose tar

              mkdir -p /tmp/code
              tar xzf - -C /tmp/code

              mkdir -p '$DEPLOY_DIR'
              rsync -a --delete /tmp/code/ '$DEPLOY_DIR/'

              cd '$DEPLOY_DIR'
              mkdir -p uploads/photos uploads/videos uploads/contracts uploads/exports uploads/qrcodes

              echo '=== Building and restarting services ==='
              # Bring down existing stack first to avoid name conflicts
              docker compose -f docker-compose.prod.yml down --remove-orphans 2>/dev/null || true
              # Force-remove any remaining stale containers
              docker rm -f elevator-tunnel elevator-admin elevator-nginx elevator-api 2>/dev/null || true
              docker compose -f docker-compose.prod.yml up -d --build --remove-orphans --force-recreate

              echo '=== Cleaning old images ==='
              docker image prune -f

              echo '=== Deployment complete ==='
              docker compose -f docker-compose.prod.yml ps
            "

      - name: Verify deployment
        run: |
          sleep 15
          echo '=== Service status ==='
          docker ps --filter 'name=elevator-' --format 'table {{.Names}}\t{{.Status}}'

          echo ''
          echo '=== Waiting for API to be healthy ==='
          for i in $(seq 1 45); do
            health=$(docker inspect --format='{{.State.Health.Status}}' elevator-api 2>/dev/null)
            [ "$health" = 'healthy' ] && echo "API healthy after ${i}s" && break
            [ $i -eq 45 ] && echo 'WARNING: API not healthy after 90s, continuing anyway'
            sleep 2
          done

          echo ''
          echo '=== Checking database users ==='
          sleep 3
          docker exec elevator-postgres psql -U elevator -d elevator_system -c 'SELECT phone, role FROM "User";' 2>&1 || echo 'No users found - seed may not have run'

      - name: Smoke test API
        run: |
          set -e
          fail() { echo "❌ $1"; exit 1; }

          echo '=== Database user count ==='
          docker exec elevator-postgres psql -U elevator -d elevator_system -c 'SELECT phone, role FROM "User";' 2>&1

          # All tests run via docker exec on the api container, which already has curl.
          # This avoids Alpine apk download failures when NAS has connectivity issues.
          echo '=== 1/4 Testing API health (waiting up to 60s) ==='
          for i in $(seq 1 30); do
            docker exec elevator-api curl -sf http://localhost:3000/api && break
            [ $i -eq 30 ] && fail 'API health check failed after 60s'
            sleep 2
          done
          echo 'API health: OK'

          echo ''
          echo '=== 2/4 Testing login endpoint ==='
          LOGIN_RESULT=$(docker exec elevator-api \
            curl -s -X POST http://localhost:3000/api/auth/login \
              -H "Content-Type: application/json" \
              -d '{"phone":"13800000000","password":"admin123"}')
          echo "$LOGIN_RESULT"
          echo "$LOGIN_RESULT" | grep -q '"accessToken"' && echo 'Login: ✅ Token received' || fail 'Login returned no token'

          echo ''
          echo '=== 3/4 Testing nginx proxy to admin (via api container) ==='
          NGINX_ADMIN=$(docker exec elevator-api \
            curl -s -o /dev/null -w "%{http_code}" http://nginx:80/)
          echo "HTTP $NGINX_ADMIN"
          [ "$NGINX_ADMIN" = "200" ] && echo 'Nginx → admin: ✅' || fail "Nginx admin returned HTTP $NGINX_ADMIN"

          echo ''
          echo '=== 4/4 Testing nginx proxy to API (via api container) ==='
          NGINX_LOGIN=$(docker exec elevator-api \
            curl -s -X POST http://nginx:80/api/auth/login \
              -H "Content-Type: application/json" \
              -d '{"phone":"13800000000","password":"admin123"}')
          echo "$NGINX_LOGIN"
          echo "$NGINX_LOGIN" | grep -q '"accessToken"' && echo 'Nginx → API login: ✅ Token received' || fail 'Nginx API login returned no token'

          echo ''
          echo '=== All smoke tests passed ✅ ==='

      - name: API container diagnostics
        if: failure()
        run: |
          echo '=== elevator-api logs (last 80 lines) ==='
          docker logs elevator-api 2>&1 | tail -80

          echo ''
          echo '=== elevator-api inspect ==='
          docker inspect elevator-api --format '{{.State.Status}} {{.State.Restarting}} {{.State.ExitCode}} {{.State.Error}}'

          echo ''
          echo '=== All containers ==='
          docker ps --filter 'name=elevator-' --format 'table {{.Names}}\t{{.Status}}'

      - name: Show remote access URL
        run: |
          echo '=== Waiting for tunnel to connect ==='
          URL=""
          for i in $(seq 1 15); do
            URL=$(docker logs elevator-tunnel 2>&1 | grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done

          echo ''
          echo '=================================================='
          echo '  🎉 远程访问地址 / Remote Access URL'
          echo '=================================================='
          if [ -n "$URL" ]; then
            echo "  $URL"
            echo ''
            echo "  后台管理: $URL"
            echo "  API接口:  $URL/api/"
          else
            echo '  ⚠️  Tunnel URL not yet available.'
            echo '  Run this to check later:'
            echo '    docker logs elevator-tunnel 2>&1 | grep trycloudflare'
          fi
          echo '=================================================='
          echo ''
          echo '默认登录: 13800000000 / admin123'
