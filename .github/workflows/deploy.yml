name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to QNAP NAS
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to NAS
        run: |
          set -e
          DOCKER="/share/CACHEDEV5_DATA/.qpkg/container-station/usr/bin/.libs/docker"
          DEPLOY_DIR="/share/CACHEDEV1_DATA/Public/ElevatorSystem"

          # The runner itself may be containerized (Container Station) without direct
          # access to /share paths or the docker socket.  Launch an Alpine helper with
          # everything mounted, install tools, then run compose.
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /share/CACHEDEV1_DATA:/share/CACHEDEV1_DATA \
            -v /share/CACHEDEV5_DATA:/share/CACHEDEV5_DATA \
            -v ${{ github.workspace }}:/src:ro \
            alpine:3.19 sh -c "
              set -e
              apk add --no-cache rsync docker-cli

              mkdir -p '$DEPLOY_DIR'

              echo '=== Syncing code ==='
              rsync -a --delete --exclude='node_modules' --exclude='.git' --exclude='uploads' /src/ '$DEPLOY_DIR/'

              cd '$DEPLOY_DIR'

              mkdir -p uploads/photos uploads/videos uploads/contracts uploads/exports

              echo '=== Building and restarting services ==='
              $DOCKER compose -f docker-compose.prod.yml up -d --build --remove-orphans

              echo '=== Cleaning old images ==='
              $DOCKER image prune -f

              echo '=== Deployment complete ==='
              $DOCKER compose -f docker-compose.prod.yml ps
            "

      - name: Verify deployment
        run: |
          sleep 15
          docker ps --filter "name=elevator-" --format "{{.Names}}: {{.Status}}"
