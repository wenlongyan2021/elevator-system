name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to QNAP NAS
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to NAS
        run: |
          set -e
          DOCKER="/share/CACHEDEV5_DATA/.qpkg/container-station/usr/bin/.libs/docker"

          # The runner container has docker CLI + socket access but no /share paths.
          # Launch an Alpine helper container with NAS paths mounted, install docker CLI
          # (which communicates via the socket), rsync code, then run compose.
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /share/CACHEDEV1_DATA:/share/CACHEDEV1_DATA \
            -v /share/CACHEDEV5_DATA:/share/CACHEDEV5_DATA \
            -v ${{ github.workspace }}:/src:ro \
            -w /share/CACHEDEV1_DATA/Public/ElevatorSystem \
            alpine:3.19 sh -c "
              apk add --no-cache rsync git docker-cli
              echo '=== Syncing code from checkout ==='
              rsync -a --delete --exclude='node_modules' --exclude='.git' --exclude='uploads' /src/ ./
              echo '=== Building and restarting services ==='
              docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
              echo '=== Cleaning old images ==='
              docker image prune -f
              echo '=== Deployment complete ==='
              docker compose -f docker-compose.prod.yml ps
            "

      - name: Verify deployment
        run: |
          sleep 15
          docker ps --filter "name=elevator-" --format "{{.Names}}: {{.Status}}"
