name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to QNAP NAS
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to NAS
        run: |
          set -e
          DEPLOY_DIR="/share/CACHEDEV1_DATA/Public/ElevatorSystem"

          # Launch Alpine helper with docker socket + NAS mounts.
          # The runner is containerized by Container Station and doesn't have
          # direct access to /share paths, so we need a helper container.
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /share/CACHEDEV1_DATA:/share/CACHEDEV1_DATA \
            -v ${{ github.workspace }}:/src:ro \
            alpine:3.19 sh -c "
              set -e
              apk add --no-cache rsync docker-cli docker-compose

              mkdir -p '$DEPLOY_DIR'

              echo '=== Syncing code ==='
              rsync -a --delete --exclude='node_modules' --exclude='.git' --exclude='uploads' /src/ '$DEPLOY_DIR/'

              cd '$DEPLOY_DIR'
              mkdir -p uploads/photos uploads/videos uploads/contracts uploads/exports

              echo '=== Building and restarting services ==='
              docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

              echo '=== Cleaning old images ==='
              docker image prune -f

              echo '=== Deployment complete ==='
              docker compose -f docker-compose.prod.yml ps
            "

      - name: Verify deployment
        run: |
          sleep 15
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            alpine:3.19 sh -c "
              apk add --no-cache docker-cli docker-compose
              echo '=== Service status ==='
              docker ps --filter 'name=elevator-' --format 'table {{.Names}}\t{{.Status}}'
            "
