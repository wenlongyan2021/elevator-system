name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to QNAP NAS
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to NAS
        run: |
          set -e
          DOCKER="/share/CACHEDEV5_DATA/.qpkg/container-station/usr/bin/.libs/docker"
          DEPLOY_DIR="/share/CACHEDEV1_DATA/Public/ElevatorSystem"

          # Create deploy directory if first time
          mkdir -p "$DEPLOY_DIR"

          # Sync code from checkout (avoids git pull credential prompt)
          rsync -a --delete \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='dist' \
            --exclude='uploads' \
            "$GITHUB_WORKSPACE/" "$DEPLOY_DIR/"

          cd "$DEPLOY_DIR"

          # Ensure data directories exist
          mkdir -p uploads/photos uploads/videos uploads/contracts uploads/exports

          # Build and restart services
          $DOCKER compose -f docker-compose.prod.yml up -d --build --remove-orphans

          # Clean old images
          $DOCKER image prune -f

          echo "=== Deployment complete ==="
          $DOCKER compose -f docker-compose.prod.yml ps

      - name: Verify deployment
        run: |
          sleep 10
          echo "=== Checking service health ==="
          DOCKER="/share/CACHEDEV5_DATA/.qpkg/container-station/usr/bin/.libs/docker"
          $DOCKER ps --filter "name=elevator-" --format "table {{.Names}}\t{{.Status}}"
          echo "=== Done ==="
