name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to QNAP NAS
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        run: |
          set -e
          DOCKER="/share/CACHEDEV5_DATA/.qpkg/container-station/usr/bin/.libs/docker"

          cd /share/CACHEDEV1_DATA/Public/ElevatorSystem

          # Pull latest code
          git pull origin main

          # Ensure data directories exist
          mkdir -p uploads/photos uploads/videos uploads/contracts uploads/exports

          # Build and restart services
          $DOCKER compose -f docker-compose.prod.yml up -d --build --remove-orphans

          # Clean old images
          $DOCKER image prune -f

          echo "=== Deployment complete ==="
          $DOCKER compose -f docker-compose.prod.yml ps
