version: '3.8'

x-common: &common
  restart: unless-stopped
  networks:
    - elevator-network

services:
  postgres:
    <<: *common
    image: postgres:16-alpine
    container_name: elevator-postgres
    environment:
      POSTGRES_USER: elevator
      POSTGRES_PASSWORD: ${DB_PASSWORD:-elevator_pass_2024}
      POSTGRES_DB: elevator_system
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elevator -d elevator_system"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    <<: *common
    image: redis:7-alpine
    container_name: elevator-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_pass_2024}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    <<: *common
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: elevator-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://elevator:${DB_PASSWORD:-elevator_pass_2024}@postgres:5432/elevator_system
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass_2024}@redis:6379
      NODE_ENV: production
      TZ: Asia/Shanghai
      UPLOAD_PATH: /app/uploads
      QR_URL_PREFIX: /uploads/qrcodes
      INSPECTION_WINDOW_DAYS: "30"
      CONTRACT_WINDOW_DAYS: "30"
      MAINTENANCE_PLAN_WINDOW_DAYS: "7"
    volumes:
      - elevator_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  admin:
    <<: *common
    build:
      context: ./web-admin
      dockerfile: Dockerfile
    container_name: elevator-admin
    depends_on:
      - api

  nginx:
    <<: *common
    image: nginx:alpine
    container_name: elevator-nginx
    depends_on:
      - api
      - admin
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - elevator_uploads:/usr/share/nginx/html/uploads:ro
      - elevator_logs:/var/log/nginx

  tunnel:
    <<: *common
    image: cloudflare/cloudflared:latest
    container_name: elevator-tunnel
    depends_on:
      - nginx
    # Quick tunnel mode — generates a random *.trycloudflare.com URL on each start.
    # For a stable URL, set TUNNEL_TOKEN env var and switch to named-tunnel mode:
    #   command: tunnel --token ${TUNNEL_TOKEN} run
    command: tunnel --url http://nginx:80
    # environment:
    #   - TUNNEL_TOKEN=${TUNNEL_TOKEN}

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  elevator_uploads:
    driver: local
  elevator_logs:
    driver: local

networks:
  elevator-network:
    driver: bridge
