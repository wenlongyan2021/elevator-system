version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: elevator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: elevator
      POSTGRES_PASSWORD: ${DB_PASSWORD:-elevator_pass_2024}
      POSTGRES_DB: elevator_system
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elevator -d elevator_system"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - elevator-network

  redis:
    image: redis:7-alpine
    container_name: elevator-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_pass_2024}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - elevator-network

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: elevator-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://elevator:${DB_PASSWORD:-elevator_pass_2024}@postgres:5432/elevator_system
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass_2024}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-elevator_jwt_secret_dev}
      NODE_ENV: production
    volumes:
      - elevator_uploads:/app/uploads
    networks:
      - elevator-network

  admin:
    build:
      context: ./web-admin
      dockerfile: Dockerfile
    container_name: elevator-admin
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - elevator-network

  nginx:
    image: nginx:alpine
    container_name: elevator-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - elevator_uploads:/usr/share/nginx/html/uploads:ro
    depends_on:
      - api
    networks:
      - elevator-network

volumes:
  postgres_data:
  redis_data:
  elevator_uploads:

networks:
  elevator-network:
    driver: bridge
